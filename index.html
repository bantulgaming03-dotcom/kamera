<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Live</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0f1316; --panel:#171d21; --line:#27323a; --text:#e8eef2; --muted:#8fa0ab;
    --accent:#3ddc97; --live:#ff4d4d; --warn:#ffb020;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    display:flex;flex-direction:column;
  }
  main{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:20px 0}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
  p.sub{color:var(--muted);margin:6px 0 24px;line-height:1.5}
  .view{display:none;flex:1;flex-direction:column;gap:14px}
  .view.on{display:flex}
  button{
    font:inherit;font-weight:600;border:0;border-radius:12px;padding:16px;cursor:pointer;
    background:var(--accent);color:#06241a;
  }
  button.alt{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  button.danger{background:var(--live);color:#fff}
  button.alt.on{border-color:var(--accent);color:var(--accent)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
  .choice{text-align:left;display:block;width:100%}
  .choice small{display:block;font-weight:400;opacity:.75;margin-top:4px}
  .stage{
    position:relative;background:#000;border-radius:14px;overflow:hidden;
    aspect-ratio:3/4;max-height:62vh;width:100%;border:1px solid var(--line);
  }
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .badge{
    position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.65);padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:600;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
  .dot.off{background:var(--muted);animation:none}
  @keyframes pulse{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .code{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;
  }
  .code b{display:block;font-size:2.2rem;letter-spacing:.18em;margin-top:4px;font-variant-numeric:tabular-nums}
  .code span{color:var(--muted);font-size:.9rem}
  input{
    font:inherit;font-size:1.6rem;text-align:center;letter-spacing:.18em;text-transform:uppercase;
    background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;
  }
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  #status{color:var(--muted);font-size:.9rem;min-height:1.3em}
  #status.err{color:var(--live)}
  .back{background:none;color:var(--muted);padding:8px;font-weight:500;align-self:flex-start}
  footer{color:var(--muted);font-size:.75rem;text-align:center;padding:12px 0}
</style>
</head>
<body>
<main>

  <!-- Beranda -->
  <section class="view on" id="home">
    <h1>Kamera Live</h1>
    <p class="sub">Pakai satu HP sebagai kamera, lihat tampilannya langsung di HP lain. Buka halaman ini di kedua HP.</p>
    <button class="choice" id="btnCam">Jadikan HP ini kamera
      <small>Untuk HP ke-2. Browser akan minta izin kamera.</small></button>
    <button class="choice alt" id="btnView">Tonton kamera
      <small>Untuk HP pertama. Masukkan kode dari HP kamera.</small></button>
  </section>

  <!-- Mode kamera (HP ke-2) -->
  <section class="view" id="camera">
    <button class="back" id="camBack">Kembali</button>
    <div class="stage">
      <video id="camPreview" autoplay muted playsinline></video>
      <div class="badge"><span class="dot off" id="camDot"></span><span id="camBadge">Menunggu izin kamera</span></div>
    </div>
    <div class="code"><span>Kode untuk HP penonton</span><b id="camCode">------</b></div>
    <div class="row">
      <button class="alt" id="btnFlip">Balik kamera</button>
      <button class="danger" id="btnStop">Hentikan</button>
    </div>
    <div id="camStatus" style="color:var(--muted);font-size:.9rem"></div>
  </section>

  <!-- Mode penonton (HP pertama) -->
  <section class="view" id="viewer">
    <button class="back" id="viewBack">Kembali</button>
    <div id="joinBox" style="display:flex;flex-direction:column;gap:12px">
      <label for="codeInput" style="color:var(--muted)">Kode dari HP kamera</label>
      <input id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABC123">
      <button id="btnJoin">Hubungkan</button>
    </div>
    <div class="stage" id="viewStage" style="display:none">
      <video id="remoteVideo" autoplay muted playsinline></video>
      <div class="badge"><span class="dot" id="viewDot"></span><span id="viewBadge">Menghubungkan</span></div>
      <div class="badge" id="recBadge" style="left:auto;right:10px;display:none"><span class="dot"></span><span id="recTime">Rekam 00:00</span></div>
    </div>
    <div id="viewTools" style="display:none;flex-direction:column;gap:10px">
      <div class="row">
        <button id="btnShot">Ambil foto</button>
        <button class="alt" id="btnRec">Rekam video</button>
      </div>
      <div class="row">
        <button class="alt" id="btnLive">Foto live</button>
        <button class="alt" id="btnTorch">Senter</button>
      </div>
      <div class="row">
        <button class="alt on" id="m_normal">Normal</button>
        <button class="alt" id="m_hdr">HDR</button>
        <button class="alt" id="m_night">Malam</button>
      </div>
      <div class="row">
        <button class="alt" id="btnSound">Nyalakan suara</button>
        <button class="alt" id="btnFull">Layar penuh</button>
      </div>
    </div>
    <div id="status"></div>
  </section>

</main>
<footer>Created By Sanzz</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const PREFIX = "sanzzcam-";
  const genCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), n => ALPHA[n % ALPHA.length]).join("");

  const views = ["home", "camera", "viewer"];
  const show = name => views.forEach(v => $(v).classList.toggle("on", v === name));

  // ---------- Mode kamera ----------
  let camPeer = null, camStream = null, facing = "environment", wakeLock = null;
  const calls = new Set();

  async function startStream() {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    $("camPreview").srcObject = camStream;
    // ganti track untuk penonton yang sudah terhubung
    calls.forEach(c => {
      const sender = c.peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
      if (sender) sender.replaceTrack(camStream.getVideoTracks()[0]);
    });
  }

  async function openCamera() {
    show("camera");
    $("camStatus").textContent = "";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $("camStatus").textContent = "Browser ini tidak mendukung kamera. Pakai Chrome atau Safari lewat HTTPS.";
      return;
    }
    try {
      await startStream();
    } catch (e) {
      $("camBadge").textContent = "Izin kamera ditolak";
      $("camStatus").textContent = "Izinkan akses kamera di pengaturan browser, lalu coba lagi.";
      return;
    }
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
    registerPeer();
  }

  function registerPeer() {
    const code = genCode();
    camPeer = new Peer(PREFIX + code);
    camPeer.on("open", () => {
      $("camCode").textContent = code;
      $("camDot").classList.remove("off");
      $("camBadge").textContent = "Kamera aktif";
    });
    camPeer.on("connection", conn => {
      conn.on("data", handleCmd);
      conn.on("open", () => {
        const call = camPeer.call(conn.peer, camStream);
        calls.add(call);
        updateViewers();
        const drop = () => { calls.delete(call); updateViewers(); };
        call.on("close", drop); call.on("error", drop);
        conn.on("close", () => { call.close(); drop(); });
      });
    });
    camPeer.on("error", err => {
      if (err.type === "unavailable-id") { camPeer.destroy(); registerPeer(); return; }
      $("camStatus").textContent = "Koneksi bermasalah: " + err.type;
    });
    camPeer.on("disconnected", () => { try { camPeer.reconnect(); } catch (_) {} });
  }

  async function handleCmd(d) {
    const tr = camStream && camStream.getVideoTracks()[0];
    if (!tr || !d) return;
    const caps = tr.getCapabilities ? tr.getCapabilities() : {};
    try {
      if (d.t === "mode") {
        const adv = {};
        if (caps.exposureMode && caps.exposureMode.includes("continuous")) adv.exposureMode = "continuous";
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes("continuous")) adv.whiteBalanceMode = "continuous";
        if (caps.exposureCompensation) {
          const c = caps.exposureCompensation;
          adv.exposureCompensation = d.v === "night" ? c.max : d.v === "hdr" ? Math.max(c.min, -1) : 0;
        }
        await tr.applyConstraints({ advanced: [adv] });
      }
      if (d.t === "torch" && caps.torch) await tr.applyConstraints({ advanced: [{ torch: !!d.v }] });
    } catch (_) {}
  }

  function updateViewers() {
    $("camStatus").textContent = calls.size ? calls.size + " perangkat sedang menonton" : "Belum ada yang menonton";
  }

  function stopCamera() {
    calls.forEach(c => c.close()); calls.clear();
    if (camPeer) camPeer.destroy(); camPeer = null;
    if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null;
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    $("camPreview").srcObject = null;
    $("camCode").textContent = "------";
    $("camDot").classList.add("off");
    $("camBadge").textContent = "Dihentikan";
  }

  $("btnCam").onclick = openCamera;
  $("btnFlip").onclick = async () => {
    facing = facing === "environment" ? "user" : "environment";
    try { await startStream(); } catch (_) { $("camStatus").textContent = "Gagal ganti kamera."; }
  };
  $("btnStop").onclick = () => { stopCamera(); show("home"); };
  $("camBack").onclick = () => { stopCamera(); show("home"); };

  // ---------- Mode penonton ----------
  let viewPeer = null;
  const setStatus = (t, err) => { $("status").textContent = t; $("status").classList.toggle("err", !!err); };

  function leaveViewer() {
    stopRec(); stopRing();
    if (viewPeer) viewPeer.destroy(); viewPeer = null;
    $("remoteVideo").srcObject = null;
    $("viewStage").style.display = "none";
    $("viewTools").style.display = "none";
    $("joinBox").style.display = "flex";
    setStatus("");
  }

  function join() {
    const code = $("codeInput").value.trim().toUpperCase();
    if (code.length !== 6) return setStatus("Kode harus 6 karakter.", true);
    if (viewPeer) viewPeer.destroy();
    setStatus("Menghubungkan ke kamera...");
    viewPeer = new Peer();
    viewPeer.on("open", () => {
      const conn = viewConn = viewPeer.connect(PREFIX + code, { reliable: true });
      conn.on("close", () => setBadge("Terputus", true));
      setTimeout(() => {
        if (!$("remoteVideo").srcObject) setStatus("Belum tersambung. Cek kode dan pastikan HP kamera masih terbuka.", true);
      }, 12000);
    });
    viewPeer.on("call", call => {
      call.answer();
      call.on("stream", stream => {
        $("remoteVideo").srcObject = stream;
        $("joinBox").style.display = "none";
        $("viewStage").style.display = "block";
        $("viewTools").style.display = "flex";
        setBadge("Live", false);
        startRing(); torchOn = false; $("btnTorch").classList.remove("on"); setMode(vmode);
        setStatus("");
      });
      call.on("close", () => setBadge("Terputus", true));
    });
    viewPeer.on("error", err => {
      setStatus(err.type === "peer-unavailable" ? "Kode tidak ditemukan. Cek lagi di HP kamera." : "Koneksi bermasalah: " + err.type, true);
    });
  }

  function setBadge(text, off) {
    $("viewBadge").textContent = text;
    $("viewDot").classList.toggle("off", off);
  }

  $("btnView").onclick = () => show("viewer");
  $("btnJoin").onclick = join;
  $("codeInput").addEventListener("keydown", e => { if (e.key === "Enter") join(); });
  $("viewBack").onclick = () => { leaveViewer(); show("home"); };
  $("btnSound").onclick = () => {
    const v = $("remoteVideo");
    v.muted = !v.muted;
    $("btnSound").textContent = v.muted ? "Nyalakan suara" : "Matikan suara";
  };
  $("btnFull").onclick = () => {
    const v = $("remoteVideo");
    (v.requestFullscreen || v.webkitRequestFullscreen || v.webkitEnterFullscreen)?.call(v);
  };

  // ---------- Simpan foto & video ----------
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  const stamp = () => {
    const d = new Date(), p = n => String(n).padStart(2, "0");
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  };

  async function saveFile(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    // iPhone: lewat menu bagikan, pilih "Simpan Gambar/Video" supaya masuk Foto
    if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  $("btnShot").onclick = () => {
    const v = $("remoteVideo");
    if (!v.videoWidth) return setStatus("Video belum siap.", true);
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    drawTo(c.getContext("2d"), c.width, c.height);
    c.toBlob(b => { saveFile(b, "foto-" + stamp() + ".jpg"); setStatus("Foto disimpan."); }, "image/jpeg", 0.92);
  };

  let rec = null, chunks = [], recTimer = null;
  const pickMime = () => ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
    .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";

  function stopRec() { if (rec && rec.state !== "inactive") rec.stop(); }

  $("btnRec").onclick = () => {
    if (rec && rec.state === "recording") return stopRec();
    const stream = recStream();
    if (!stream) return setStatus("Video belum siap.", true);
    if (!window.MediaRecorder) return setStatus("Browser ini tidak mendukung rekam video.", true);
    const mime = pickMime();
    chunks = [];
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      if (procStop) { procStop(); procStop = null; }
      clearInterval(recTimer);
      $("recBadge").style.display = "none";
      $("btnRec").textContent = "Rekam video";
      $("btnRec").classList.remove("danger");
      const type = rec.mimeType || mime || "video/webm";
      const ext = type.includes("mp4") ? "mp4" : "webm";
      if (chunks.length) { saveFile(new Blob(chunks, { type }), "video-" + stamp() + "." + ext); setStatus("Video disimpan."); }
    };
    rec.start(1000);
    const t0 = Date.now();
    const tick = () => {
      const s = Math.floor((Date.now() - t0) / 1000), p = n => String(n).padStart(2, "0");
      $("recTime").textContent = "Rekam " + p(Math.floor(s / 60)) + ":" + p(s % 60);
    };
    tick(); recTimer = setInterval(tick, 1000);
    $("recBadge").style.display = "flex";
    $("btnRec").textContent = "Stop & simpan";
    $("btnRec").classList.add("danger");
    setStatus("");
  };

  // ---------- Mode HDR / Malam, senter, foto live ----------
  const FILTERS = {
    normal: "none",
    hdr: "contrast(1.2) saturate(1.25) brightness(1.08)",
    night: "brightness(1.9) contrast(1.15) saturate(0.9)"
  };
  let vmode = "normal", viewConn = null, torchOn = false, procStop = null;

  const sendCmd = m => { try { if (viewConn && viewConn.open) viewConn.send(m); } catch (_) {} };

  function setMode(m) {
    vmode = m;
    $("remoteVideo").style.filter = FILTERS[m];
    ["normal", "hdr", "night"].forEach(k => $("m_" + k).classList.toggle("on", k === m));
    sendCmd({ t: "mode", v: m });
  }

  function drawTo(ctx, w, h) {
    ctx.filter = FILTERS[vmode];
    ctx.drawImage($("remoteVideo"), 0, 0, w, h);
    ctx.filter = "none";
  }

  // Sumber rekaman: kalau mode bukan Normal, rekam lewat canvas supaya efeknya ikut tersimpan
  function recStream() {
    const v = $("remoteVideo"), src = v.srcObject;
    const canFilter = "filter" in CanvasRenderingContext2D.prototype && typeof HTMLCanvasElement.prototype.captureStream === "function";
    if (vmode === "normal" || !src || !canFilter) return src;
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    const x = c.getContext("2d");
    let run = true;
    const loop = () => { if (!run) return; drawTo(x, c.width, c.height); requestAnimationFrame(loop); };
    loop();
    procStop = () => { run = false; };
    const s = c.captureStream(30);
    src.getAudioTracks().forEach(t => s.addTrack(t));
    return s;
  }

  // Buffer 1,5 detik terakhir untuk foto live
  const LW = 640, FPS = 12, PRE = 18;
  let ring = [], ringT = null;
  function startRing() {
    stopRing();
    const v = $("remoteVideo");
    ringT = setInterval(() => {
      if (!v.videoWidth) return;
      const c = ring.length >= PRE ? ring.shift() : document.createElement("canvas");
      c.width = LW; c.height = Math.round(LW * v.videoHeight / v.videoWidth);
      drawTo(c.getContext("2d"), c.width, c.height);
      ring.push(c);
    }, 1000 / FPS);
  }
  function stopRing() { clearInterval(ringT); ring = []; }

  $("btnLive").onclick = () => {
    if (!ring.length) return setStatus("Video belum siap.", true);
    if (!window.MediaRecorder || typeof HTMLCanvasElement.prototype.captureStream !== "function")
      return setStatus("Browser ini tidak mendukung foto live.", true);
    const id = stamp(), pre = ring.slice();
    const out = document.createElement("canvas");
    out.width = pre[0].width; out.height = pre[0].height;
    const x = out.getContext("2d");
    x.drawImage(pre[pre.length - 1], 0, 0);
    out.toBlob(b => saveFile(b, "foto-live-" + id + ".jpg"), "image/jpeg", 0.92);
    const mime = pickMime(), ch = [];
    const r = new MediaRecorder(out.captureStream(FPS), mime ? { mimeType: mime } : undefined);
    r.ondataavailable = e => { if (e.data.size) ch.push(e.data); };
    r.onstop = () => {
      const type = r.mimeType || mime || "video/webm";
      saveFile(new Blob(ch, { type }), "foto-live-" + id + "." + (type.includes("mp4") ? "mp4" : "webm"));
      setStatus("Foto live disimpan: foto + klip 3 detik.");
    };
    setStatus("Merekam foto live...");
    let i = 0;
    r.start();
    const t = setInterval(() => {
      if (i < pre.length) x.drawImage(pre[i], 0, 0); else drawTo(x, out.width, out.height);
      if (++i >= PRE * 2) { clearInterval(t); r.stop(); }
    }, 1000 / FPS);
  };

  ["normal", "hdr", "night"].forEach(k => { $("m_" + k).onclick = () => setMode(k); });
  $("btnTorch").onclick = () => {
    torchOn = !torchOn;
    $("btnTorch").classList.toggle("on", torchOn);
    sendCmd({ t: "torch", v: torchOn });
  };

  window.addEventListener("pagehide", () => { stopCamera(); if (viewPeer) viewPeer.destroy(); });
})();
</script>
</body>
</html>
